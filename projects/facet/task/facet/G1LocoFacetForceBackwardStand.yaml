# @package task
defaults:
  - /task/facet/G1LocoFacetForceForward@_here_
  - _self_

name: G1LocoFacetForceBackwardStand

# Stage 3: learn the falling edge of either force direction. Positive and
# negative pulls retain both walking gaits; after either release the reference
# is held at the release CoM and the same standing terms take over.
command:
  fixed_velocity: false
  force_drive_prob: 1.0
  force_drive_x_range: [8., 8.]
  force_drive_y_range: [0., 0.]
  force_drive_z_range: [0., 0.]
  # Zero samples the sign independently, so forward and backward pulls are
  # both present during continued training.
  force_drive_direction: 0.0
  force_drive_duration_range: [3.0, 5.0]
  force_drive_once: false
  # Cover prolonged zero-force replay, not only a few recovery steps. Across
  # the vectorized batch both force signs are still sampled independently.
  force_drive_interval_range: [4.0, 14.0]
  force_drive_start_delay_range: [0.5, 1.5]
  stand_on_force_release: true
  disturbance_prob: 0.0

reward:
  loco:
    # These terms were disabled in the continuous-force task because it had
    # no release transition. They are gated to zero-speed/released periods by
    # the reward implementations and do not alter backward walking directly.
    facet_stand_root_motion:
      _target_: facet_stand_root_motion
      # Keep some damping for large body excursions, but do not make every
      # instantaneous step velocity costly: the release objective is bounded
      # net motion, not a frozen double-support pose.
      weight: 0.20
      linear_sigma: 0.08
      angular_sigma: 0.20
    facet_stand_root_position:
      _target_: facet_stand_root_position
      # Stronger release-anchor feedback directly opposes the measured drift.
      weight: 1.50
      position_sigma: 0.12
    facet_stand_mean_velocity:
      _target_: facet_stand_mean_velocity
      weight: 2.0
      averaging_time: 0.8
      velocity_sigma: 0.04
      settling_time: 0.4
    # Correct the persistent left-knee-at-stop / right-leg-outside solution.
    # These are soft measured-state costs; no joint target or action scale is
    # changed. Walking uses only the contacting-knee safety margin.
    facet_knee_extension_margin:
      _target_: facet_knee_extension_margin
      weight: 1.5
      joint_names: [left_knee_joint, right_knee_joint]
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      min_flexion: 0.05
      angle_sigma: 0.12
    facet_stand_support_center:
      _target_: facet_stand_support_center
      weight: 1.5
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      settling_time: 0.8
      contact_time: 0.08
      contact_ramp_time: 0.12
      lateral_tolerance: 0.04
      position_sigma: 0.06
    facet_stand_leg_balance:
      _target_: facet_stand_leg_balance
      weight: 1.0
      knee_names: [left_knee_joint, right_knee_joint]
      hip_names: [left_hip_pitch_joint, right_hip_pitch_joint]
      averaging_time: 0.8
      knee_tolerance: 0.08
      hip_tolerance: 0.10
      angle_sigma: 0.12
    facet_stand_joint_posture:
      # Do not pull the legs back to a static default pose after release.
      weight: 0.0
    facet_stand_foot_contact:
      # A dynamic balance response may use alternating support.
      weight: 0.0
    facet_stand_foot_velocity:
      # Penalize net root drift rather than all foot motion.
      weight: 0.0
    facet_stand_torso_stability:
      _target_: facet_stand_torso_stability
      weight: 1.00
      body_name: torso_link
      angle_sigma: 0.18
      rate_sigma: 0.80

    # Track the force-generated preview with the same objective for both signs.
    # The legacy impedance_vel has a much broader 0.5 m/s tolerance; retain it
    # as FACET's preview objective and add this calibrated walking anchor.
    facet_force_velocity_tracking:
      _target_: facet_force_velocity_tracking
      weight: 4.0
      velocity_sigma: 0.12
    root_lateral_velocity_l2:
      weight: 0.35
      reference_frame: task
      allow_force_drive: true
      velocity_sigma: 0.10

    # Geometry remains relevant while taking zero-net-speed balance steps.
    # Use a soft width range, not an exact double-support stance or mirrored
    # joint trajectory. The per-foot corridor prevents translating both feet
    # to one side while satisfying only their relative separation.
    feet_lateral_separation:
      include_standing: true
      min_separation: 0.12
      min_knee_separation: 0.10
    facet_foot_lateral_corridor:
      _target_: facet_foot_lateral_corridor
      weight: 1.0
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      inner_bound: -0.02
      outer_bound: 0.20
      position_sigma: 0.08
    facet_body_pitch_roll_l2: {weight: 16.0, body_name: torso_link}

    # Re-enable the backward gait terms that Stage 1 intentionally disabled.
    # Forward terms remain inherited from G1LocoFacetForceForward.
    # Replaced by the common two-axis term above; avoid rewarding backward
    # speed twice while giving forward speed only one tracking objective.
    facet_backward_com_velocity_tracking: {weight: 0.0}
    facet_backward_straightness: {weight: 1.0}
    facet_backward_step_symmetry: {weight: 0.80}
    biped_alternating_contact_backward: {weight: 2.75}
    biped_swing_height_backward: {weight: 1.25}
    biped_swing_knee_flexion_backward: {weight: 0.75}
    biped_knee_phase_symmetry_backward: {weight: 0.75}
    biped_swing_hip_flexion_backward: {weight: 0.70}
    biped_swing_forward_backward: {weight: 1.20}
    biped_swing_foot_placement_backward: {weight: 1.10}
    biped_stride_limit_backward: {weight: 1.00}
    biped_stance_foot_velocity_backward: {weight: 0.75}
