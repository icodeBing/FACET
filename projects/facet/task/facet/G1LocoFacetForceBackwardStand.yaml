# @package task
defaults:
  - /task/facet/G1LocoFacetForceForward@_here_
  - _self_

name: G1LocoFacetForceBackwardStand

# Stage 3: learn the falling edge of either force direction. Positive and
# negative pulls retain both walking gaits; after either release the reference
# is held at the release CoM and the same standing terms take over.
command:
  fixed_velocity: false
  force_drive_prob: 1.0
  force_drive_x_range: [8., 8.]
  force_drive_y_range: [0., 0.]
  force_drive_z_range: [0., 0.]
  # Zero samples the sign independently, so forward and backward pulls are
  # both present during continued training.
  force_drive_direction: 0.0
  force_drive_duration_range: [3.0, 5.0]
  force_drive_once: false
  force_drive_interval_range: [2.0, 4.0]
  force_drive_start_delay_range: [0.5, 1.5]
  stand_on_force_release: true
  disturbance_prob: 0.0

reward:
  loco:
    # These terms were disabled in the continuous-force task because it had
    # no release transition. They are gated to zero-speed/released periods by
    # the reward implementations and do not alter backward walking directly.
    facet_stand_root_motion:
      _target_: facet_stand_root_motion
      # Keep some damping for large body excursions, but do not make every
      # instantaneous step velocity costly: the release objective is bounded
      # net motion, not a frozen double-support pose.
      weight: 0.20
      linear_sigma: 0.08
      angular_sigma: 0.20
    facet_stand_root_position:
      _target_: facet_stand_root_position
      # Stronger release-anchor feedback directly opposes the measured drift.
      weight: 1.50
      position_sigma: 0.12
    facet_stand_joint_posture:
      # Do not pull the legs back to a static default pose after release.
      weight: 0.0
    facet_stand_foot_contact:
      # A dynamic balance response may use alternating support.
      weight: 0.0
    facet_stand_foot_velocity:
      # Penalize net root drift rather than all foot motion.
      weight: 0.0
    facet_stand_torso_stability:
      _target_: facet_stand_torso_stability
      weight: 1.00
      body_name: torso_link
      angle_sigma: 0.18
      rate_sigma: 0.80

    # Reduce the large lateral component measured during forward pulls.
    root_lateral_velocity_l2: {weight: 1.0}
    facet_body_pitch_roll_l2: {weight: 16.0, body_name: torso_link}

    # Re-enable the backward gait terms that Stage 1 intentionally disabled.
    # Forward terms remain inherited from G1LocoFacetForceForward.
    facet_backward_com_velocity_tracking: {weight: 4.0}
    facet_backward_straightness: {weight: 1.0}
    facet_backward_step_symmetry: {weight: 0.80}
    biped_alternating_contact_backward: {weight: 2.75}
    biped_swing_height_backward: {weight: 1.25}
    biped_swing_knee_flexion_backward: {weight: 0.75}
    biped_knee_phase_symmetry_backward: {weight: 0.75}
    biped_swing_hip_flexion_backward: {weight: 0.70}
    biped_swing_forward_backward: {weight: 1.20}
    biped_swing_foot_placement_backward: {weight: 1.10}
    biped_stride_limit_backward: {weight: 1.00}
    biped_stance_foot_velocity_backward: {weight: 0.75}
