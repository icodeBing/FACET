# @package task
defaults:
  - /task/facet/G1LocoFacet@_here_
  - _self_

name: G1LocoFacetForceForward

# Stage 1: identify the force-to-reference and reference-to-gait loop with one
# stationary, positive task heading.  The pull lasts longer than an episode,
# so there is no release transition or force resampling during this stage.
command:
  virtual_mass_range: [4., 4., 4.]
  linear_kp_range: [0., 0.]
  linear_kd_range: [32., 32.]
  angular_kp_range: [12., 12.]
  angular_kd_range: [6., 6.]
  fixed_velocity: false
  force_drive_prob: 1.0
  force_drive_x_range: [16., 16.]
  force_drive_y_range: [0., 0.]
  force_drive_z_range: [0., 0.]
  force_drive_duration_range: [100., 100.]
  force_drive_direction: 1.0
  force_drive_once: true
  force_drive_interval_range: [0., 0.]
  force_drive_start_delay_range: [0., 0.]
  stand_on_force_release: false
  disturbance_prob: 0.0
  randomize_gait_phase: true

  # These fields are unused when fixed_velocity=false, but setting them to
  # deterministic values prevents accidental command sampling if this task is
  # later overridden from the command line.
  linvel_x_range: [0., 0.]
  backward_linvel_x_range: [-0.30, -0.30]
  backward_prob: 0.0
  stand_prob: 0.0
  linvel_y_range: [0., 0.]
  yawvel_range: [0., 0.]

reward:
  loco:
    # Use the ground heading frame so a tilted torso cannot make the feet
    # appear level merely by leaning with them.
    feet_pitch_neutral:
      reference_frame: heading
      weight: 1.20
      target_pitch: 0.0
      pitch_sigma: 0.08
    feet_roll_neutral:
      reference_frame: heading
      weight: 2.00
      target_roll: 0.0
      roll_sigma: 0.06
      stance_sigma: 0.05
      swing_sigma: 0.12
    feet_roll_symmetry:
      reference_frame: heading
      weight: 1.20
      target_mean_roll: 0.0
      symmetry_sigma: 0.08
      mean_sigma: 0.10

    # Replay means were pelvis pitch -0.36 rad and torso pitch +0.15 rad.
    # Penalize the pelvis tilt directly and discourage waist compensation.
    facet_root_pitch_roll_l2: {weight: 6.0, target_roll: 0.0, target_pitch: 0.0}
    facet_root_pitch_roll_exp:
      _target_: facet_root_pitch_roll_exp
      weight: 3.0
      target_roll: 0.0
      target_pitch: 0.0
      sigma: 0.25
    root_upright: {weight: 2.0}
    body_upright: {weight: 5.0, body_name: torso_link}
    facet_body_pitch_roll_exp:
      _target_: facet_body_pitch_roll_exp
      weight: 0.0
      body_name: torso_link
      target_roll: 0.0
      target_pitch: 0.0
      sigma: 0.16
    facet_body_pitch_roll_l2:
      _target_: facet_body_pitch_roll_l2
      # The previous replay settled at torso pitch ~= 0.41 rad.  Keep a
      # dense world-frame torso signal while the waist-pitch anchor below
      # removes the joint-limit compensation that caused that lean.
      weight: 12.0
      body_name: torso_link
      target_roll: 0.0
      target_pitch: 0.0
    joint_deviation_l2_waist: {weight: 7.0, joint_names: [waist.*]}
    joint_deviation_l2_waist_pitch:
      _target_: joint_deviation_l2
      # The broad waist term already includes this joint.  This explicit
      # extra anchor is intentional: the replay put waist_pitch_joint at its
      # positive limit, so torso uprightness was being obtained by folding at
      # the waist while the pelvis leaned backward.
      weight: 16.0
      joint_names: [waist_pitch_joint]

    # Stage 1 contains no backward or release-standing objective.
    facet_backward_com_velocity_tracking: {weight: 0.0}
    facet_backward_straightness: {weight: 0.0}
    facet_backward_step_symmetry: {weight: 0.0}
    biped_alternating_contact_backward: {weight: 0.0}
    biped_swing_height_backward: {weight: 0.0}
    biped_swing_knee_flexion_backward: {weight: 0.0}
    biped_knee_phase_symmetry_backward: {weight: 0.0}
    biped_swing_hip_flexion_backward: {weight: 0.0}
    biped_swing_forward_backward: {weight: 0.0}
    biped_swing_foot_placement_backward: {weight: 0.0}
    biped_stride_limit_backward: {weight: 0.0}
    biped_stance_foot_velocity_backward: {weight: 0.0}

    # There is no force-release event in this stage. Keep the stand-only terms
    # out of the objective instead of relying only on their runtime mask.
    facet_stand_joint_posture: {weight: 0.0}
    facet_stand_foot_contact: {weight: 0.0}
    facet_stand_foot_velocity: {weight: 0.0}
    facet_stand_torso_stability: {weight: 0.0}
    facet_stand_root_motion: {weight: 0.0}
    facet_stand_root_position: {weight: 0.0}
    facet_stand_actual_com_speed: {weight: 0.0}

