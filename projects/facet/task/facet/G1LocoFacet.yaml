# @package task
# FACET impedance tracking with a from-scratch G1 locomotion curriculum.
defaults:
  - /task/facet/G1Force@_here_
  - _self_

name: G1LocoFacet

# Keep the unlocked waist from using a large backward lean as a tracking
# shortcut.  These overrides intentionally affect only the waist joints.
input:
  action:
    action_scaling:
      # Use the released G1-29DoF locomotion scales so the policy has enough
      # joint authority to lift the swing leg and produce a real stride.
      .*hip_pitch.*: 0.548
      .*hip_roll.*: 0.351
      .*hip_yaw.*: 0.548
      .*knee.*: 0.351
      .*ankle.*: 0.439
      # The experiment isolates pelvis FACET compliance from arm strategies.
      # Zero scaling makes JointPosition command the asset default pose for
      # these joints while preserving the policy/action tensor interface.
      ".*shoulder.*": 0.0
      ".*elbow_joint": 0.0
      ".*wrist.*": 0.0
      waist_yaw_joint: 0.25
      waist_roll_joint: 0.25
      waist_pitch_joint: 0.25

# Keep the phase supplied to the actor identical to the phase used by every
# gait reward below. A mismatch makes the contact target effectively hidden.
observation:
  policy:
    gait_phase: {period: 0.8}

command:
  _target_: ImpedanceCommandManager
  virtual_mass_range: [2., 4., 8.]
  # FACET reference-model stiffness range. Set both bounds equal during
  # playback to compare a fixed impedance gain under matched disturbances.
  linear_kp_range: [2., 30.]
  eef_body_name: null
  arm_body_name: null
  # Use the paper-scale preview and smoothing horizon.  A short [1,2,4]
  # horizon made the policy chase instantaneous posture errors instead of
  # building a consistent support-to-swing transition.
  ref_steps: [8, 16, 32]
  temporal_smoothing: 32
  fixed_velocity: true
  # Expand forward speed gradually while retaining backward and stand data
  # from the beginning. Backward commands start at 15% and rise to 20% after
  # forward tracking reaches the curriculum threshold.
  linvel_x_range: [0.20, 0.90]
  backward_linvel_x_range: [-0.50, -0.20]
  backward_prob: 0.20
  velocity_curriculum: true
  velocity_curriculum_initial_x_range: [0.20, 0.35]
  velocity_curriculum_initial_backward_prob: 0.15
  velocity_curriculum_initial_stand_prob: 0.05
  # facet_track_lin_vel has weight 1.5; 1.2 is 80% of its maximum.
  velocity_curriculum_tracking_threshold: 1.2
  velocity_curriculum_step: 0.0025
  # Finish expanding forward speed before ramping the backward/stand shares.
  velocity_curriculum_extra_step: 0.02
  linvel_y_range: [0.0, 0.0]
  yawvel_range: [0.0, 0.0]
  # Add explicit standing only after the initial forward gait has had time to
  # form. Keep the final stand share small so it cannot dominate locomotion.
  stand_prob: 0.05
  # Keep the near-zero dead zone narrow so only an explicit stand sample is
  # classified as standing; this preserves the validated walking distribution.
  stand_speed_threshold: 0.02
  # The released Unitree gait reward uses a fixed episode phase. Keep the
  # target observable and avoid adding a second source of phase variation.
  randomize_gait_phase: true
  # Short pelvis impulses are part of this experiment.  The impulse is applied
  # both to the physical pelvis and to the FACET reference dynamics.
  # Disturbance robustness is added after nominal walking is stable. External
  # impulses during this phase make the policy learn survival before gait.
  disturbance_prob: 0.0
  disturbance_force_x_range: [80., 200.]
  disturbance_force_y_range: [80., 200.]
  disturbance_force_z_range: [0., 20.]
  disturbance_duration_range: [0.4, 0.6]

reward:
  loco:
    # FACET tracks root/pelvis reference dynamics; no end-effector objective is
    # configured. Leg joints stay free for gait, while arms use soft posture
    # regularization and root/torso terms provide whole-body stabilization.
    impedance_pos: {weight: 0.75}
    # The previous run kept walking but retained roughly 0.29 m/s FACET
    # velocity error. Increase tracking pressure without changing the command.
    impedance_vel: {weight: 1.50}
    # Nominal walking anchor. It is disabled automatically while an external
    # impulse is active, preserving FACET's compliant response during tests.
    facet_track_lin_vel: {weight: 1.50, sigma: 0.16}
    # Direct nominal CoM tracking prevents a low-speed shuffling solution;
    # FACET reference tracking remains active above it.
    linvel_exp: {weight: 1.00, sigma: 0.16, dim: 2}
    # The last replay accumulated 3-4 rad of heading drift in each 20 s
    # episode despite a zero yaw command. Keep heading and yaw rate anchored
    # more strongly during nominal straight walking.
    impedance_yaw_pos: {weight: 2.0}
    impedance_yaw_vel: {weight: 2.0}
    # Measures torso pitch and roll directly through the body gravity vector.
    body_upright: {weight: 4.0, body_name: torso_link}
    root_upright: {weight: 0.75}
    root_pitch_exp:
      _target_: root_pitch_exp
      weight: 1.20
      target_pitch: -0.03
      sigma: 0.10
      body_name: torso_link
    root_pitch_rate_l2:
      _target_: root_pitch_rate_l2
      weight: 0.35
      body_name: torso_link
    base_height_exp: {weight: 1.8, target_height: 0.74}
    # Keep zero-speed commands free to choose their balance posture. Retain
    # root/torso stabilization below, but do not prescribe a fixed foot pose.
    facet_stand_root_motion:
      _target_: facet_stand_root_motion
      weight: 0.80
      linear_sigma: 0.08
      angular_sigma: 0.20
    facet_stand_root_position:
      _target_: facet_stand_root_position
      # Keep this gentle in mixed locomotion; the stand-only task overrides it.
      weight: 0.50
      position_sigma: 0.08
    facet_stand_torso_stability:
      _target_: facet_stand_torso_stability
      weight: 0.50
      body_name: torso_link
      angle_sigma: 0.18
      rate_sigma: 0.80
    angvel_xy_l2: {weight: 0.40, body_names: [pelvis, torso_link]}
    angvel_z_exp: {weight: 1.5, gamma: 0.8}
    root_yaw_rate_l2: {weight: 0.80}
    root_lateral_velocity_l2: {weight: 0.80}

    # Restore the posture anchors used by the validated direct-velocity task.
    # These constrain the unlocked waist and prevent hip yaw/roll from being
    # used as a shortcut for root-reference tracking.
    joint_deviation_l2_waist: {weight: 4.0, joint_names: [waist.*]}
    joint_deviation_l2_waist_pitch:
      _target_: joint_deviation_l2
      weight: 2.5
      joint_names: [waist_pitch_joint]
    # Directly damp oscillation of all three waist joints. This is separate
    # from the arm-only joint velocity regularizer below.
    joint_vel_l2_waist:
      _target_: joint_vel_l2
      weight: 0.03
      joint_names: [waist_yaw_joint, waist_roll_joint, waist_pitch_joint]
    joint_deviation_l1_legs:
      _target_: joint_deviation_l1
      weight: 0.5
      joint_names: [.*hip_roll_joint, .*hip_yaw_joint]

    # Unitree-style phase-aware gait shaping supplements FACET reference
    # tracking. The observable phase and contact target both use 0.8 s.
    feet_clearance:
      # This legacy term uses total xy distance; keep it soft so it cannot
      # replace the explicit lateral-width constraint below with fore-aft gap.
      weight: 0.50
      feet_names: ".*_ankle_roll_link"
    feet_orientation:
      weight: 1.25
      feet_names: ".*_ankle_roll_link"
      body_name: torso_link
    feet_pitch_neutral:
      weight: 0.80
      feet_names: ".*_ankle_roll_link"
      body_name: torso_link
      target_pitch: 0.0
      pitch_sigma: 0.10
    feet_roll_neutral:
      weight: 1.00
      feet_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      body_name: torso_link
      target_roll: 0.0
      roll_sigma: 0.08
      period: 0.8
      stance_ratio: 0.55
      stance_sigma: 0.07
      swing_sigma: 0.16
    feet_roll_symmetry:
      _target_: feet_roll_symmetry
      weight: 0.80
      feet_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      body_name: torso_link
      target_mean_roll: 0.0
      symmetry_sigma: 0.12
      mean_sigma: 0.18
    # Kept available for comparison, but excluded from training: the current
    # velocity gate gives near-static feet almost full reward.
    max_feet_height:
      weight: 0.0
      body_names: ".*_ankle_roll_link"
      target_height: 0.10
    biped_swing_height:
      weight: 1.10
      body_names: ".*_ankle_roll_link"
      period: 0.8
      stance_ratio: 0.55
      nominal_height: 0.025
      clearance: 0.08
      height_sigma: 0.040
      command_direction: forward
    biped_swing_knee_flexion:
      weight: 0.60
      joint_names: ["left_knee_joint", "right_knee_joint"]
      period: 0.8
      stance_ratio: 0.55
      target_flexion: 0.48
      flexion_sigma: 0.20
      command_direction: forward
    biped_knee_phase_symmetry:
      weight: 0.65
      joint_names: ["left_knee_joint", "right_knee_joint"]
      period: 0.8
      stance_ratio: 0.55
      target_flexion: 0.48
      sigma: 0.18
      command_direction: forward
    biped_stance_knee_posture:
      weight: 0.80
      joint_names: ["left_knee_joint", "right_knee_joint"]
      period: 0.8
      stance_ratio: 0.55
      sigma: 0.12
    biped_swing_hip_flexion:
      weight: 0.40
      joint_names: ["left_hip_pitch_joint", "right_hip_pitch_joint"]
      period: 0.8
      stance_ratio: 0.55
      # G1 hip-pitch convention: negative displacement swings the thigh
      # forward from the nominal -0.1 rad posture.
      target_flexion: -0.28
      flexion_sigma: 0.16
      command_direction: forward
    # Low-weight forward swing shaping provides a dense step signal while
    # limiting the requested stride to the commanded walking speed.
    biped_swing_forward:
      weight: 0.65
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      # At 0.35 m/s this targets about 0.27 m per foot step.
      step_length_scale: 0.95
      min_step_length: 0.12
      # Keep headroom for the next 0.45-0.50 m/s curriculum stage.
      max_step_length: 0.42
      velocity_sigma: 0.28
      command_direction: forward
    biped_swing_foot_placement:
      weight: 0.75
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      step_length_scale: 0.95
      min_step_length: 0.10
      # Do not clip the placement target when command speed is raised.
      max_step_length: 0.40
      position_sigma: 0.10
      command_direction: forward
    biped_stride_limit:
      weight: 0.75
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      max_separation: 0.30
      scale: 0.08
      command_direction: forward
    biped_stance_foot_velocity:
      weight: 0.50
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      speed_scale: 0.35
      command_direction: forward
    feet_lateral_separation:
      # The new replay improved the median signed gap to 9.8 cm and reduced
      # negative gaps below 1%, but mesh-vertex overlap flags remain in about
      # 11-13% of frames. Preserve foot ordering with additional width margin.
      weight: 2.25
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      knee_body_names: ["left_knee_link", "right_knee_link"]
      # The previous replay had a 13.5 cm median foot-center gap.  A 17 cm
      # signed minimum gives a visible but still recoverable walking width.
      min_separation: 0.17
      min_knee_separation: 0.11
      order_scale: 0.08
      max_separation: 0.28
      scale: 0.06
    biped_alternating_contact:
      weight: 3.5
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      threshold: 0.55
      command_direction: forward
    facet_backward_com_velocity_tracking:
      _target_: facet_backward_com_velocity_tracking
      weight: 4.00
      sigma: 0.12
    facet_backward_straightness:
      _target_: facet_backward_straightness
      weight: 1.00
      lateral_velocity_sigma: 0.10
      cross_track_sigma: 0.12
      heading_sigma: 0.12
    facet_backward_step_symmetry:
      _target_: facet_backward_step_symmetry
      weight: 0.80
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      sigma: 0.06
    # Backward gait shaping uses the weights validated in the isolated task,
    # with a negative-command mask so the forward policy keeps its own weights.
    biped_alternating_contact_backward:
      _target_: biped_alternating_contact
      weight: 2.75
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      period: 0.8
      threshold: 0.55
      command_direction: backward
    biped_swing_height_backward:
      _target_: biped_swing_height
      weight: 1.25
      body_names: ".*_ankle_roll_link"
      period: 0.8
      stance_ratio: 0.55
      nominal_height: 0.025
      clearance: 0.065
      height_sigma: 0.045
      command_direction: backward
    biped_swing_knee_flexion_backward:
      _target_: biped_swing_knee_flexion
      weight: 0.75
      joint_names: [left_knee_joint, right_knee_joint]
      period: 0.8
      stance_ratio: 0.55
      target_flexion: 0.48
      flexion_sigma: 0.20
      command_direction: backward
    biped_knee_phase_symmetry_backward:
      _target_: biped_knee_phase_symmetry
      weight: 0.75
      joint_names: [left_knee_joint, right_knee_joint]
      period: 0.8
      stance_ratio: 0.55
      target_flexion: 0.48
      sigma: 0.18
      command_direction: backward
    biped_swing_hip_flexion_backward:
      _target_: biped_swing_hip_flexion
      weight: 0.70
      joint_names: [left_hip_pitch_joint, right_hip_pitch_joint]
      period: 0.8
      stance_ratio: 0.55
      target_flexion: -0.28
      flexion_sigma: 0.16
      command_direction: backward
    biped_swing_forward_backward:
      _target_: biped_swing_forward
      weight: 1.20
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      period: 0.8
      stance_ratio: 0.55
      min_step_length: 0.08
      step_length_scale: 0.90
      max_step_length: 0.25
      velocity_sigma: 0.18
      command_direction: backward
    biped_swing_foot_placement_backward:
      _target_: biped_swing_foot_placement
      weight: 1.10
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      period: 0.8
      stance_ratio: 0.55
      min_step_length: 0.08
      step_length_scale: 0.90
      max_step_length: 0.25
      position_sigma: 0.075
      command_direction: backward
    biped_stride_limit_backward:
      _target_: biped_stride_limit
      weight: 1.00
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      max_separation: 0.26
      scale: 0.06
      command_direction: backward
    biped_stance_foot_velocity_backward:
      _target_: biped_stance_foot_velocity
      weight: 0.75
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      period: 0.8
      stance_ratio: 0.55
      speed_scale: 0.25
      command_direction: backward
    biped_air_time_target:
      # Each foot must periodically leave and return; this breaks the
      # right-foot-stays-down solution seen in the 0.2 m/s replay.
      weight: 1.0
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      target_sigma: 0.12

    # Per-foot and root telemetry. These terms are computed and logged but do
    # not enter the optimization objective.
    facet_left_foot_contact:
      {_target_: facet_foot_contact, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], foot_index: 0}
    facet_right_foot_contact:
      {_target_: facet_foot_contact, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], foot_index: 1}
    facet_left_foot_air_time:
      {_target_: facet_foot_air_time, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], foot_index: 0}
    facet_right_foot_air_time:
      {_target_: facet_foot_air_time, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], foot_index: 1}
    facet_left_foot_touchdown_interval:
      {_target_: facet_foot_touchdown_interval, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], foot_index: 0}
    facet_right_foot_touchdown_interval:
      {_target_: facet_foot_touchdown_interval, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], foot_index: 1}
    facet_left_foot_step_length:
      {_target_: facet_foot_step_length, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], foot_index: 0}
    facet_right_foot_step_length:
      {_target_: facet_foot_step_length, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], foot_index: 1}
    facet_left_foot_knee_peak_flexion:
      {_target_: facet_foot_knee_peak_flexion, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], knee_names: ["left_knee_joint", "right_knee_joint"], foot_index: 0}
    facet_right_foot_knee_peak_flexion:
      {_target_: facet_foot_knee_peak_flexion, weight: 1.0, enabled: false, body_names: ["left_ankle_roll_link", "right_ankle_roll_link"], knee_names: ["left_knee_joint", "right_knee_joint"], foot_index: 1}
    facet_root_y_position: {weight: 1.0, enabled: false}
    facet_root_yaw: {weight: 1.0, enabled: false}
    facet_root_yaw_rate: {weight: 1.0, enabled: false}
    # Velocity-chain diagnostics. These are logged but do not affect PPO.
    facet_command_linvel_x: {weight: 1.0, enabled: false}
    facet_reference_linvel_x: {weight: 1.0, enabled: false}
    facet_actual_com_linvel_x: {weight: 1.0, enabled: false}
    facet_command_linvel_b_x: {weight: 1.0, enabled: false}
    facet_command_linvel_b_y: {weight: 1.0, enabled: false}
    facet_reference_linvel_b_x: {weight: 1.0, enabled: false}
    facet_reference_linvel_b_y: {weight: 1.0, enabled: false}
    facet_actual_com_linvel_b_x: {weight: 1.0, enabled: false}
    facet_actual_com_linvel_b_y: {weight: 1.0, enabled: false}
    facet_command_speed: {weight: 1.0, enabled: false}
    facet_actual_com_speed: {weight: 1.0, enabled: false}
    facet_command_reference_vel_error: {weight: 1.0, enabled: false}
    facet_command_actual_vel_error: {weight: 1.0, enabled: false}
    facet_command_reference_vel_b_error: {weight: 1.0, enabled: false}
    facet_command_actual_vel_b_error: {weight: 1.0, enabled: false}
    facet_root_link_com_vel_delta: {weight: 1.0, enabled: false}
    facet_root_link_com_pos_delta: {weight: 1.0, enabled: false}

    # Keep arms and wrists near their default pose; no phase-driven arm motion.
    joint_pos_default:
      weight: 0.5
      joint_names: [".*shoulder.*", ".*elbow_joint", ".*wrist.*"]
    joint_vel_l2:
      weight: 0.02
      joint_names: [".*shoulder.*", ".*elbow_joint", ".*wrist.*"]
    # A 0.8 s cycle with 55% stance leaves about 0.36 s for swing. The
    # inherited 0.5 s minimum-air-time penalty contradicted that phase target.
    feet_air_time:
      # Unitree's G1 gait combines phase contact, clearance and air-time terms.
      # This sparse touchdown term discourages the observed near-zero right-foot flight.
      weight: 2.0
      body_names: ".*ankle_roll_link"
      thres: 0.25
    feet_sliding:
      weight: 0.60
      body_names: ".*_ankle_roll_link"

    # Keep hip pitch near its nominal value while the leg is supporting. The
    # phase-specific term above supplies the swing excursion.
    joint_deviation_l2_hip_pitch:
      _target_: joint_deviation_l2
      weight: 0.15
      joint_names: [.*hip_pitch_joint]

    # Reduce ankle chatter while keeping enough ankle authority for balance.
    joint_deviation_l2_ankle:
      _target_: joint_deviation_l2
      weight: 0.12
      joint_names: [".*ankle_pitch_joint", ".*ankle_roll_joint"]
    joint_vel_l2_ankle:
      _target_: joint_vel_l2
      weight: 0.005
      joint_names: [".*ankle_pitch_joint", ".*ankle_roll_joint"]
    # Mild whole-leg damping suppresses high-frequency knee/hip/ankle chatter
    # without removing the phase-shaped swing excursion.
    joint_vel_l2_legs:
      _target_: joint_vel_l2
      weight: 0.001
      joint_names:
        - ".*hip_pitch_joint"
        - ".*hip_roll_joint"
        - ".*hip_yaw_joint"
        - ".*knee_joint"
        - ".*ankle_pitch_joint"
        - ".*ankle_roll_joint"
    joint_acc_l2_legs:
      _target_: joint_acc_l2
      # Unitree G1 uses 2.5e-7 globally; 1e-5 suppressed leg swing in this task.
      weight: 2.5e-7
      joint_names:
        - ".*hip_pitch_joint"
        - ".*hip_roll_joint"
        - ".*hip_yaw_joint"
        - ".*knee_joint"
        - ".*ankle_pitch_joint"
        - ".*ankle_roll_joint"
    action_rate_l2:
      weight: 0.015
    action_rate2_l2:
      weight: 0.003

    # FACET evaluation telemetry. Logged but disabled, so it does not alter training.
    facet_external_force_norm: {weight: 1.0, enabled: false}
    facet_external_force_active: {weight: 1.0, enabled: false}
    facet_pelvis_ref_pos_error: {weight: 1.0, enabled: false}
    facet_pelvis_ref_vel_error: {weight: 1.0, enabled: false}
    facet_pelvis_pitch_roll_abs: {weight: 1.0, enabled: false}
    facet_leg_joint_pos_dev:
      weight: 1.0
      enabled: false
      joint_names: [".*hip_.*", ".*knee.*", ".*ankle.*"]
    facet_leg_joint_vel_rms:
      weight: 1.0
      enabled: false
      joint_names: [".*hip_.*", ".*knee.*", ".*ankle.*"]
