# @package task
# FACET impedance tracking with the validated G1 locomotion objective.
defaults:
  - /task/facet/G1Force@_here_
  - _self_

name: G1LocoFacet

command:
  _target_: ImpedanceCommandManager
  virtual_mass_range: [2., 4., 8.]
  eef_body_name: null
  arm_body_name: null
  ref_steps: [8, 16, 32]
  temporal_smoothing: 32
  fixed_velocity: true
  linvel_x_range: [-0.8, 1.4]
  linvel_y_range: [-0.8, 0.8]
  yawvel_range: [-2.0, 2.0]
  stand_prob: 0.05

reward:
  loco:
    # FACET reference tracking remains the planar translation objective.
    # Keep yaw command tracking and biped-specific gait/posture regularizers.
    angvel_z_exp: {weight: 1.2, gamma: 0.8}

    # Phase-aware G1 gait shaping supplements, but does not replace, FACET
    # reference tracking. All phase terms share the policy's 0.8 s gait clock.
    feet_clearance:
      weight: 1.0
      feet_names: ".*_ankle_roll_link"
    feet_orientation:
      weight: 0.15
      feet_names: ".*_ankle_roll_link"
      body_name: torso_link
    biped_swing_height:
      weight: 1.0
      body_names: ".*_ankle_roll_link"
      period: 0.8
      stance_ratio: 0.55
      nominal_height: 0.025
      clearance: 0.07
      height_sigma: 0.03
    biped_swing_forward:
      weight: 0.2
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      step_length_scale: 0.35
      min_step_length: 0.08
      max_step_length: 0.45
      velocity_sigma: 0.35
    biped_swing_foot_placement:
      weight: 0.25
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      step_length_scale: 0.35
      min_step_length: 0.08
      max_step_length: 0.45
      position_sigma: 0.08
    biped_stance_foot_velocity:
      weight: 0.05
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      speed_scale: 0.5
    feet_lateral_separation:
      weight: 1.0
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      max_separation: 0.28
      scale: 0.08
    biped_alternating_contact:
      weight: 0.35
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      threshold: 0.55

    # Keep arms and wrists near their default pose; no phase-driven arm motion.
    joint_pos_default:
      weight: 0.05
      joint_names: [".*shoulder.*", ".*elbow_joint", ".*wrist.*"]
    joint_vel_l2:
      weight: 0.006
      joint_names: [".*shoulder.*", ".*elbow_joint", ".*wrist.*"]
    # A 0.8 s cycle with 55% stance leaves about 0.36 s for swing. The
    # inherited 0.5 s minimum-air-time penalty contradicted that phase target.
    feet_air_time:
      weight: 0.5
      body_names: ".*ankle_roll_link"
      thres: 0.3
