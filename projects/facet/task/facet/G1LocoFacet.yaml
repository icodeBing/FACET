# @package task
# FACET impedance tracking with the validated G1 locomotion objective.
defaults:
  - /task/facet/G1Force@_here_
  - _self_

name: G1LocoFacet

command:
  _target_: ImpedanceCommandManager
  virtual_mass_range: [2., 4., 8.]
  eef_body_name: null
  arm_body_name: null
  ref_steps: [8, 16, 32]
  temporal_smoothing: 32
  fixed_velocity: true
  linvel_x_range: [-0.8, 1.4]
  linvel_y_range: [-0.8, 0.8]
  yawvel_range: [-2.0, 2.0]
  stand_prob: 0.05

reward:
  loco:
    # FACET reference tracking remains the planar translation objective.
    # Keep yaw command tracking and biped-specific gait/posture regularizers.
    angvel_z_exp: {weight: 1.2, gamma: 0.8}

    # G1-specific gait priors. These leave the FACET reference dynamics intact
    # but add constraints to the policy's physical realization of that target.
    feet_clearance:
      weight: 1.0
      feet_names: ".*_ankle_roll_link"
    feet_orientation:
      weight: 0.15
      feet_names: ".*_ankle_roll_link"
      body_name: torso_link
    max_feet_height:
      weight: 1.0
      body_names: ".*_ankle_roll_link"
      target_height: 0.1
    feet_lateral_separation:
      weight: 1.0
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      max_separation: 0.28
      scale: 0.08
    biped_alternating_contact:
      weight: 0.35
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      threshold: 0.55

    # Keep the arms near the robot's validated nominal posture.  This is a
    # soft posture prior, not a scripted arm trajectory, so FACET remains free
    # to yield to external forces.
    joint_pos_default:
      weight: 0.03
      joint_names: [".*shoulder.*", ".*elbow_joint"]
    joint_vel_l2:
      weight: 0.003
      joint_names: [".*shoulder.*", ".*elbow_joint"]
