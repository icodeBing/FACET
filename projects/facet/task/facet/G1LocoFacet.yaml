# @package task
# FACET impedance tracking with the validated G1 locomotion objective.
defaults:
  - /task/facet/G1Force@_here_
  - _self_

name: G1LocoFacet

# Keep the unlocked waist from using a large backward lean as a tracking
# shortcut.  These overrides intentionally affect only the waist joints.
input:
  action:
    action_scaling:
      waist_roll_joint: 0.32
      waist_pitch_joint: 0.28

command:
  _target_: ImpedanceCommandManager
  virtual_mass_range: [2., 4., 8.]
  eef_body_name: null
  arm_body_name: null
  # Stage 1: establish a stable straight-walking FACET baseline.  The
  # impedance reference remains active; only its preview horizon is shortened
  # so it does not fight the 0.8 s gait clock while posture is recovered.
  ref_steps: [1, 2, 4]
  temporal_smoothing: 4
  fixed_velocity: true
  linvel_x_range: [0.4, 0.4]
  linvel_y_range: [0.0, 0.0]
  yawvel_range: [0.0, 0.0]
  stand_prob: 0.0
  randomize_gait_phase: false

reward:
  loco:
    # FACET tracks root/pelvis reference dynamics; no end-effector objective is
    # configured. Leg joints stay free for gait, while arms use soft posture
    # regularization and root/torso terms provide whole-body stabilization.
    impedance_pos: {weight: 0.75}
    impedance_vel: {weight: 1.5}
    impedance_yaw_pos: {weight: 0.75}
    impedance_yaw_vel: {weight: 1.0}
    # Measures torso pitch and roll directly through the body gravity vector.
    body_upright: {weight: 3.0, body_name: torso_link}
    base_height_exp: {weight: 1.5, target_height: 0.74}
    angvel_xy_l2: {weight: 0.04, body_names: [pelvis, torso_link]}
    angvel_z_exp: {weight: 1.2, gamma: 0.8}

    # Restore the posture anchors used by the validated direct-velocity task.
    # These constrain the unlocked waist and prevent hip yaw/roll from being
    # used as a shortcut for root-reference tracking.
    joint_deviation_l2_waist: {weight: 2.5, joint_names: [waist.*]}
    joint_deviation_l2_waist_pitch:
      _target_: joint_deviation_l2
      weight: 1.5
      joint_names: [waist_pitch_joint]
    joint_deviation_l1_legs:
      _target_: joint_deviation_l1
      weight: 0.5
      joint_names: [.*hip_roll_joint, .*hip_yaw_joint]

    # Phase-aware G1 gait shaping supplements, but does not replace, FACET
    # reference tracking. All phase terms share the policy's 0.8 s gait clock.
    feet_clearance:
      weight: 1.0
      feet_names: ".*_ankle_roll_link"
    feet_orientation:
      weight: 0.15
      feet_names: ".*_ankle_roll_link"
      body_name: torso_link
    biped_swing_height:
      weight: 1.0
      body_names: ".*_ankle_roll_link"
      period: 0.8
      stance_ratio: 0.55
      nominal_height: 0.025
      clearance: 0.09
      height_sigma: 0.03
    biped_swing_forward:
      weight: 0.5
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      # Conservative step targets while recovering a compact straight gait.
      step_length_scale: 0.3
      min_step_length: 0.05
      max_step_length: 0.24
      velocity_sigma: 0.35
    biped_swing_foot_placement:
      weight: 0.75
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      step_length_scale: 0.3
      min_step_length: 0.05
      max_step_length: 0.24
      position_sigma: 0.08
    biped_stride_limit:
      weight: 1.0
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      max_separation: 0.30
      scale: 0.08
    biped_stance_foot_velocity:
      weight: 0.05
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      stance_ratio: 0.55
      speed_scale: 0.5
    feet_lateral_separation:
      # Keep the anti-crossing guard without suppressing normal swing.
      weight: 0.5
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      knee_body_names: ["left_knee_link", "right_knee_link"]
      min_separation: 0.1
      min_knee_separation: 0.06
      order_scale: 0.16
      max_separation: 0.28
      scale: 0.08
    biped_alternating_contact:
      weight: 0.35
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
      period: 0.8
      threshold: 0.55

    # Keep arms and wrists near their default pose; no phase-driven arm motion.
    joint_pos_default:
      weight: 0.5
      joint_names: [".*shoulder.*", ".*elbow_joint", ".*wrist.*"]
    joint_vel_l2:
      weight: 0.02
      joint_names: [".*shoulder.*", ".*elbow_joint", ".*wrist.*"]
    # A 0.8 s cycle with 55% stance leaves about 0.36 s for swing. The
    # inherited 0.5 s minimum-air-time penalty contradicted that phase target.
    feet_air_time:
      weight: 0.5
      body_names: ".*ankle_roll_link"
      thres: 0.3
