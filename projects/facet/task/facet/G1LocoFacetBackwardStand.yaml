# @package task
defaults:
  - /task/facet/G1LocoFacet@_here_
  - _self_

name: G1LocoFacetBackwardStand

# Isolate backward walking and standing while retaining the v3 policy as the
# initialization. Zero forward samples are classified as explicit stand tasks.
command:
  linvel_x_range: [0.0, 0.0]
  backward_linvel_x_range: [-0.30, -0.15]
  backward_prob: 0.50
  velocity_curriculum: false
  stand_prob: 0.0
  stand_speed_threshold: 0.02
  linvel_y_range: [0.0, 0.0]
  yawvel_range: [0.0, 0.0]
  disturbance_prob: 0.0

reward:
  loco:
    # A direct signed velocity term is needed for this isolated backward test;
    # the generic FACET reference remains active, but its compliant preview is
    # intentionally slower than the command during the observed failure.
    facet_backward_com_velocity_tracking:
      _target_: facet_backward_com_velocity_tracking
      weight: 2.00
      sigma: 0.12

    # Use the Unitree-style phase/contact/clearance chain for backward walking.
    # The existing terms project motion onto the signed command direction, so
    # these weights improve rearward stepping without changing forward config.
    biped_alternating_contact:
      weight: 2.75
    biped_swing_height:
      weight: 1.25
      clearance: 0.065
      height_sigma: 0.045
    biped_swing_knee_flexion:
      weight: 0.75
    biped_knee_phase_symmetry:
      weight: 0.75
    biped_swing_hip_flexion:
      weight: 0.70
    biped_swing_forward:
      weight: 1.20
      min_step_length: 0.08
      max_step_length: 0.30
      velocity_sigma: 0.18
    biped_swing_foot_placement:
      weight: 1.10
      min_step_length: 0.08
      max_step_length: 0.30
      position_sigma: 0.075
    biped_stride_limit:
      weight: 1.00
      max_separation: 0.26
      scale: 0.06
    biped_stance_foot_velocity:
      weight: 0.75
      speed_scale: 0.25

    # These conditional metrics are logged, but do not enter PPO's objective.
    facet_backward_actual_com_linvel_b_x:
      {_target_: facet_backward_actual_com_linvel_b_x, weight: 1.0, enabled: false}
    facet_backward_actual_com_linvel_b_x_error:
      {_target_: facet_backward_actual_com_linvel_b_x_error, weight: 1.0, enabled: false}
    facet_stand_actual_com_speed:
      {_target_: facet_stand_actual_com_speed, weight: 1.0, enabled: false}
