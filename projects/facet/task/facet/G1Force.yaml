# @package task
name: G1Force

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [4.0, 4.0, 4.0]

robot:
  name: g1_waist_unlocked
terrain: plane

num_envs: 4096
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

input:
  action:
    _target_: JointPosition
    action_scaling:
      .*hip_pitch.*: 0.548
      .*hip_roll.*: 0.351
      .*hip_yaw.*: 0.548
      .*knee.*: 0.351
      waist_yaw_joint: 0.541
      waist_roll_joint: 0.439
      waist_pitch_joint: 0.439
      .*ankle.*: 0.439
      .*shoulder.*: 0.173
      .*elbow_joint: 0.173
    max_delay: 2
    alpha_range: [0.8, 1.0]

command:
  _target_: ImpedanceCommandManager
  # Scale the paper's {1, 2, 4} kg schedule by the G1/Go2 MJCF mass ratio.
  # 33.34 / 16.44 ~= 2.03, rounded to the reproducible {2, 4, 8} kg bins.
  virtual_mass_range: [2., 4., 8.]
  eef_body_name: null
  arm_body_name: null
  ref_steps: [8, 16, 32]
  temporal_smoothing: 32

observation:
  policy:
    command: {}
    gravity_multistep: {steps: 6, noise_std: 0.05}
    joint_pos_multistep:
      joint_names: "(?!(.*wrist.*)).*"
      steps: 6
      noise_std: 0.05
    joint_vel_multistep:
      joint_names: "(?!(.*wrist.*)).*"
      steps: 6
      noise_std: 0.2
    prev_actions: {steps: 2}
  priv:
    root_linvel_b: {yaw_only: true}
    root_angvel_b: {}
    contact_indicator:
      body_names: [".*ankle_roll_link"]
  ext:
    external_forces: {body_names: ["pelvis"]}
    external_torques: {body_names: ["pelvis"]}

reward:
  loco:
    impedance_yaw_pos: {weight: 0.75}
    impedance_yaw_vel: {weight: 1.0}
    impedance_pos: {weight: 0.75}
    impedance_vel: {weight: 1.5}
    body_upright: {weight: 1.0, body_name: torso_link}
    linvel_z_l2: {weight: 0.5}
    angvel_xy_l2: {weight: 0.02, body_names: [pelvis, torso_link]}
    energy_l1: {weight: 2.0e-4}
    joint_acc_l2: {weight: 1.0e-7}
    joint_torques_l2: {weight: 5.0e-6}
    action_rate_l2: {weight: 0.005}
    action_rate2_l2: {weight: 0.005}
    survival: {weight: 1.0}
    feet_sliding: {weight: 0.2, body_names: ".*_ankle_roll_link"}
    feet_air_time: {weight: 1.0, body_names: ".*ankle_roll_link", thres: 0.5}
    undesired_contact:
      weight: 2.0
      body_names:
        - ".*_hip_.*_link"
        - ".*_knee_link"
        - "torso_link"

termination:
  crash:
    # Arm contacts are intentionally allowed during recovery from disturbances.
    body_names_expr:
      - "pelvis"
      - "torso_link"
      - ".*_hip_.*_link"
      - ".*_knee_link"
    t_thres: 0.1
  fall_over: {xy_thres: 0.9}

randomization:
  perturb_body_mass:
    .*: [0.8, 1.2]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.6, 2.0]
    dynamic_friction_range: [0.6, 2.0]
    restitution_range: [0.0, 0.2]
  motor_params:
    stiffness_range:
      .*: [0.8, 1.1]
    damping_range:
      .*: [0.8, 1.1]
  reset_joint_states_uniform:
    pos_ranges:
      .*: [-0.1, 0.1]
    rel: true
