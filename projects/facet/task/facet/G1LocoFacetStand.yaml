# @package task
defaults:
  - /task/facet/G1LocoFacetBackwardStand@_here_
  - _self_

name: G1LocoFacetStand

# Isolate zero-velocity stance. The stand reward terms are enabled by the
# command manager's standing mask; phase/swing rewards remain inactive.
command:
  linvel_x_range: [0.0, 0.0]
  backward_linvel_x_range: [-0.30, -0.15]
  backward_prob: 0.0
  stand_prob: 1.0
  velocity_curriculum: false
  fixed_velocity: true

reward:
  loco:
    # The previous stand run had zero pitch-angle/rate rewards because the
    # walking-only terms are gated off for stand commands. Add explicit
    # stand-only torso damping and strengthen CoM anchoring without changing
    # the walking or backward task.
    facet_stand_torso_stability:
      weight: 2.00
      angle_sigma: 0.18
      rate_sigma: 0.80
    facet_stand_root_motion:
      weight: 1.50
      linear_sigma: 0.08
      angular_sigma: 0.20
    facet_stand_root_position:
      weight: 1.00
      position_sigma: 0.08

    # Standing should not receive any phase-driven reward or target velocity.
    facet_backward_com_velocity_tracking: {weight: 0.0}
    facet_backward_step_symmetry: {weight: 0.0}
    biped_alternating_contact: {weight: 0.0}
    biped_swing_height: {weight: 0.0}
    biped_swing_knee_flexion: {weight: 0.0}
    biped_knee_phase_symmetry: {weight: 0.0}
    biped_stance_knee_posture: {weight: 0.0}
    biped_swing_hip_flexion: {weight: 0.0}
    biped_swing_forward: {weight: 0.0}
    biped_swing_foot_placement: {weight: 0.0}
    biped_stride_limit: {weight: 0.0}
    biped_stance_foot_velocity: {weight: 0.0}
    feet_air_time: {weight: 0.0}
